# Hosted prototype with the optional two-phone relay.
# Build: pip install --disable-pip-version-check segno && python tools/pack.py && python tools/verify.py
# Start: python serve.py
# SEAT_TOKEN protects joining the player roles; the game page opens directly.
# One instance: the relay stores its state in memory.

services:
  - type: web
    name: deux-complices
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: |
      pip install --disable-pip-version-check segno
      python tools/pack.py
      python tools/verify.py
    startCommand: python serve.py
    envVars:
      - key: SEAT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
